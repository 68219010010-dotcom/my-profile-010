<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="profile-card">
        <img
            src="68219010010.jpg"
            alt="รูปโปรไฟล์"
            class="profile-image"
        >

        <h1>My Profile</h1>
        <p>ชื่อ-นามสกุล: <span id="fullname">ธนศักดิ์ อินทุย</span></p>
        <p>ชื่อเล่น: <span id="nickname">ปาย</span></p>
        <p>รหัสประจำตัว: <span id="studentID">68219010010</span></p>

        <section class="motto">
            <h2>คติประจำใจ</h2>
            <p id="motto">มองผมโบ๋มุมโก๋ผมก็มี</p>
        </section>

        <button id="greetingBtn" type="button">ทักทาย</button>
        <p id="greetingMessage">ยินดีต้อนรับสู่โปรไฟล์ของฉัน</p>
    </main>
</body>
</html>
